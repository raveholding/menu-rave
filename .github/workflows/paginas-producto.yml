# Regenera las páginas públicas de cada producto (vista previa al compartir por
# WhatsApp/redes) con lo que los comercios publicaron en la nube. Sólo lee la tabla
# pública `menus` con la clave publicable que ya está en index.html: no usa secretos.
name: Páginas de producto
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paginas-producto
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/paginas_producto.py .
      - name: Guardar cambios
        run: |
          git config user.name "Sistema RAVE (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add -A m sitemap.xml
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Páginas de producto actualizadas desde la nube"
          git push
